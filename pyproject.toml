[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "packetshad-mixed_precision_overflow_consistency_check"
version = "0.1.0"
description = "在同一个输入里两两比对，检测自动驾驶规划控制专家·混合精度的溢出与下溢相关的矛盾表述，把冲突双方原样并排呈现"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "packetshad" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://packetshad.github.io"
Repository = "https://github.com/packetshad/mixed_precision_overflow_consistency_check"
Issues = "https://github.com/packetshad/mixed_precision_overflow_consistency_check/issues"

[project.scripts]
mixed_precision_overflow_consistency_check = "mixed_precision_overflow_consistency_check:main"

[tool.setuptools]
py-modules = ["mixed_precision_overflow_consistency_check"]
